services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brokerage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brokerage_secret}
      POSTGRES_DB: ${POSTGRES_DB:-brokerage}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brokerage}"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "5433:5432"

  api:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"

  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/docker-entrypoint.sh:/docker-entrypoint.sh:ro
      - certbot-webroot:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt
    environment:
      - DOMAIN=${DOMAIN:-ip213-165-72-53.pbiaas.com}
    entrypoint: /docker-entrypoint.sh
    depends_on:
      - api

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    environment:
      - DOMAIN=${DOMAIN:-ip213-165-72-53.pbiaas.com}
      - CERTBOT_EMAIL=${CERTBOT_EMAIL:-admin@example.com}
    depends_on:
      - nginx
    entrypoint: /bin/sh
    command:
      - -c
      - |
        # Wait for nginx to be ready to serve ACME challenges
        echo "==> Waiting for nginx to start..."
        sleep 10

        # Request initial certificate if none exists
        if [ ! -d /etc/letsencrypt/renewal ] || [ -z "$$(ls /etc/letsencrypt/renewal/ 2>/dev/null)" ]; then
          echo "==> No certificate found, requesting from Let's Encrypt..."
          # Remove temporary self-signed cert so certbot can create its own
          rm -rf "/etc/letsencrypt/live/$$DOMAIN"
          rm -rf "/etc/letsencrypt/archive/$$DOMAIN"
          certbot certonly --webroot -w /var/www/certbot \
            -d "$$DOMAIN" \
            --email "$$CERTBOT_EMAIL" \
            --agree-tos --non-interactive --force-renewal \
            && echo "==> Certificate obtained! Reloading nginx..." \
            || echo "==> Certificate request failed (will retry on next loop)"
        fi

        # Renewal loop
        trap exit TERM
        while :; do
          sleep 12h
          certbot renew --quiet
        done

volumes:
  pgdata:
  certbot-webroot:
  certbot-certs:
