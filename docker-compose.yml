services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brokerage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brokerage_secret}
      POSTGRES_DB: ${POSTGRES_DB:-brokerage}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brokerage}"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "5433:5432"

  api:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"

  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-webroot:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      - api

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: ""
    command: >
      sh -c "trap exit TERM; while :; do sleep 12h; certbot renew --quiet; done"

volumes:
  pgdata:
  certbot-webroot:
  certbot-certs:
